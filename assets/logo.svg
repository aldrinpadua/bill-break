<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="UNO Ledger logo">
  <defs>
    <linearGradient id="unoG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa4ff"/>
      <stop offset="1" stop-color="#2f6fd6"/>
    </linearGradient>
  </defs>
  <!-- one rounded tile = a single shared bill -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#unoG)"/>
  <!-- split fairly into equal shares -->
  <g fill="#ffffff">
    <path d="M50 50 L52.35 20.09 A30 30 0 0 1 77.08 62.92 Z"/>
    <path d="M50 50 L74.72 66.99 A30 30 0 0 1 25.28 66.99 Z" fill-opacity="0.9"/>
    <path d="M50 50 L22.92 62.92 A30 30 0 0 1 47.65 20.09 Z" fill-opacity="0.8"/>
  </g>
</svg>
