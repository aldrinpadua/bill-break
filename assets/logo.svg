<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="UNO Ledger logo">
  <defs>
    <linearGradient id="unoTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f2"/>
    </linearGradient>
  </defs>
  <!-- one rounded tile = a single shared bill -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#unoTile)" stroke="#e3e6ea"/>
  <!-- split fairly into three equal shares: red · yellow · gray -->
  <path d="M50 50 L52.35 20.09 A30 30 0 0 1 77.08 62.92 Z" fill="#E5322D"/>
  <path d="M50 50 L74.72 66.99 A30 30 0 0 1 25.28 66.99 Z" fill="#F6BE00"/>
  <path d="M50 50 L22.92 62.92 A30 30 0 0 1 47.65 20.09 Z" fill="#6B7280"/>
</svg>
