<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bill Break — split trips & bills with friends</title>
  <meta name="description" content="Split bills and trip expenses with friends. Groups, itemized splits, multi-currency, smart settle-up, and email reminders." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">🧾</span>
        <div>
          <div class="brand-name">Bill Break</div>
          <div class="brand-sub">split anything, fairly</div>
        </div>
      </div>

      <div class="you-card" id="youCard"></div>

      <nav class="nav">
        <button class="nav-item" data-view="dashboard">🏠 <span>Dashboard</span></button>
        <button class="nav-item" data-view="friends">🧑‍🤝‍🧑 <span>Friends</span></button>
      </nav>

      <div class="nav-section">
        <div class="nav-section-head"><span>Groups</span><button class="mini-btn" data-new="group" title="New group">＋</button></div>
        <div id="groupList" class="nav-list"></div>
      </div>

      <div class="nav-section">
        <div class="nav-section-head"><span>Trips</span><button class="mini-btn" data-new="trip" title="New trip">＋</button></div>
        <div id="tripList" class="nav-list"></div>
      </div>

      <div class="sidebar-foot">
        <button class="link-btn" id="dataBtn">💾 Backup</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main" id="main"></main>
  </div>

  <!-- Mobile drawer backdrop (tap to close the sidebar) -->
  <div class="backdrop" id="backdrop" hidden></div>

  <!-- Modal host -->
  <div class="modal-host" id="modalHost" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
